# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo → New Blueprint → deploy API + Postgres, then set Netlify VITE_API_URL.

databases:
  - name: food-delivery-db
    plan: free
    databaseName: food_delivery
    user: food_delivery

services:
  - type: web
    name: food-delivery-api
    runtime: node
    plan: free
    branch: paymentTest
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run client:build
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /api/v1/public/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SALT_ROUNDS
        value: "10"
      - key: SEED_IF_EMPTY
        value: "true"
      - key: SEED_PROFILE
        value: demo
      - key: CLIENT_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
